[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="lunar-hemisphere-analysis"
version="1.0.0"
description="Near-side/far-side lunar analysis with NASA LOLA and Robbins crater data"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Ali Razeghi"}]
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","matplotlib>=3.7","rasterio>=1.3"]

[project.optional-dependencies]
dev=["pytest>=7.4"]

[project.scripts]
lunar-analyze="lunar_analysis.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
